spring:
  datasource:
    url: jdbc:h2:mem:analytics_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest

app:
  analytics:
    api-key: test-key
