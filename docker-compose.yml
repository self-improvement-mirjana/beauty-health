# Posle izmena u backend/src: obnovi JAR u kontejneru — npr.
#   docker compose build backend && docker compose up -d backend
# Za banku:
#   docker compose build bank && docker compose up -d bank
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beauty_health
      POSTGRES_USER: beauty_health
      POSTGRES_PASSWORD: beauty_health
    ports:
      - "5432:5432"
    volumes:
      - beauty_health_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty_health -d beauty_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-bank:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mock_bank
      POSTGRES_USER: mock_bank
      POSTGRES_PASSWORD: mock_bank
    ports:
      - "5433:5432"
    volumes:
      - mock_bank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock_bank -d mock_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Smoke test against this stack (from host): backend/scripts/demo-api-flow.sh
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beauty_health
      SPRING_DATASOURCE_USERNAME: beauty_health
      SPRING_DATASOURCE_PASSWORD: beauty_health
      APP_BANK_BASE_URL: http://bank:8090
      APP_BANK_MERCHANT_SLUG: beauty-health
      APP_BANK_SIGNING_MODE: RSA
      # Ove vrednosti se popunjavaju iz bank/scripts/demo-issue-cert.sh
      APP_BANK_PRIVATE_KEY_PEM: ""
      APP_BANK_BANK_PUBLIC_KEY_PEM: ""
    depends_on:
      postgres:
        condition: service_healthy

  bank:
    build:
      context: ./bank
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-bank:5432/mock_bank
      SPRING_DATASOURCE_USERNAME: mock_bank
      SPRING_DATASOURCE_PASSWORD: mock_bank
      BANK_MASTER_KEY: demo-master-key-change-in-production!!
      BANK_JWT_SECRET: bank-jwt-secret-demo-minimum-32-chars!!
    depends_on:
      postgres-bank:
        condition: service_healthy

volumes:
  beauty_health_pgdata:
  mock_bank_pgdata:
