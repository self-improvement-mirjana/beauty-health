# Posle izmena u backend/src: obnovi JAR u kontejneru — npr.
#   docker compose build backend && docker compose up -d backend
# Za banku:
#   docker compose build bank && docker compose up -d bank
# Za analytics-service:
#   docker compose build analytics-service && docker compose up -d analytics-service
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beauty_health
      POSTGRES_USER: beauty_health
      POSTGRES_PASSWORD: beauty_health
    ports:
      - "5432:5432"
    volumes:
      - beauty_health_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty_health -d beauty_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-bank:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mock_bank
      POSTGRES_USER: mock_bank
      POSTGRES_PASSWORD: mock_bank
    ports:
      - "5433:5432"
    volumes:
      - mock_bank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock_bank -d mock_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-analytics:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beauty_health_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5434:5432"
    volumes:
      - beauty_health_analytics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d beauty_health_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode (bez ZooKeeper-a). Listener:
  #   - INTERNAL (docker network):  kafka:29092
  #   - EXTERNAL (host machine):    localhost:9092
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "beauty-health-kraft-1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18

  # Smoke test against this stack (from host): backend/scripts/demo-api-flow.sh
  # End-to-end analytics smoke: backend/scripts/demo-analytics-flow.sh
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beauty_health
      SPRING_DATASOURCE_USERNAME: beauty_health
      SPRING_DATASOURCE_PASSWORD: beauty_health
      APP_BANK_BASE_URL: http://bank:8090
      APP_BANK_MERCHANT_SLUG: beauty-health
      APP_BANK_SIGNING_MODE: RSA
      # Ove vrednosti se popunjavaju iz bank/scripts/demo-issue-cert.sh
      APP_BANK_PRIVATE_KEY_PEM: ""
      APP_BANK_BANK_PUBLIC_KEY_PEM: ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_ANALYTICS_KAFKA_ENABLED: "true"
      APP_ANALYTICS_SERVICE_BASE_URL: http://analytics-service:8081
      APP_ANALYTICS_SERVICE_API_KEY: dev-analytics-api-key
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bank:
    build:
      context: ./bank
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-bank:5432/mock_bank
      SPRING_DATASOURCE_USERNAME: mock_bank
      SPRING_DATASOURCE_PASSWORD: mock_bank
      BANK_MASTER_KEY: demo-master-key-change-in-production!!
      BANK_JWT_SECRET: bank-jwt-secret-demo-minimum-32-chars!!
    depends_on:
      postgres-bank:
        condition: service_healthy

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-analytics:5432/beauty_health_analytics
      SPRING_DATASOURCE_USERNAME: analytics
      SPRING_DATASOURCE_PASSWORD: analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_ANALYTICS_TOPIC: bh.analytics.events.v1
      APP_ANALYTICS_API_KEY: dev-analytics-api-key
    depends_on:
      postgres-analytics:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  beauty_health_pgdata:
  mock_bank_pgdata:
  beauty_health_analytics_pgdata:
  kafka_data:
