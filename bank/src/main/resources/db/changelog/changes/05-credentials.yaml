databaseChangeLog:
  - changeSet:
      id: b05-create-merchant-credential
      author: mockbank
      changes:
        - createTable:
            tableName: merchant_credential
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: merchant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: serial, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: fingerprint_sha256, type: VARCHAR(128), constraints: { nullable: true } }
              - column: { name: public_key_pem, type: TEXT, constraints: { nullable: true } }
              - column: { name: private_key_pem_encrypted, type: TEXT, constraints: { nullable: true } }
              - column: { name: hmac_secret_encrypted, type: TEXT, constraints: { nullable: true } }
              - column: { name: valid_from, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: valid_to, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: revoked_at, type: TIMESTAMP, constraints: { nullable: true } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_credential_merchant
            baseTableName: merchant_credential
            baseColumnNames: merchant_id
            referencedTableName: merchant
            referencedColumnNames: id
        - createIndex:
            indexName: idx_credential_merchant_id
            tableName: merchant_credential
            columns:
              - column: { name: merchant_id }
