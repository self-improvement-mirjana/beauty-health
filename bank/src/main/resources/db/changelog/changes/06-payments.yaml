databaseChangeLog:
  - changeSet:
      id: b06-create-payment-intent
      author: mockbank
      changes:
        - createTable:
            tableName: payment_intent
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: payment_ref, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: merchant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: external_order_id, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: amount, type: "DECIMAL(12,2)", constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(3), defaultValue: "RSD", constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), defaultValue: "CREATED", constraints: { nullable: false } }
              - column: { name: return_url_success, type: VARCHAR(2048), constraints: { nullable: true } }
              - column: { name: return_url_failure, type: VARCHAR(2048), constraints: { nullable: true } }
              - column: { name: expires_at, type: TIMESTAMP, constraints: { nullable: true } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_intent_merchant
            baseTableName: payment_intent
            baseColumnNames: merchant_id
            referencedTableName: merchant
            referencedColumnNames: id
        - createIndex:
            indexName: idx_intent_merchant_id
            tableName: payment_intent
            columns:
              - column: { name: merchant_id }
        - createIndex:
            indexName: idx_intent_status
            tableName: payment_intent
            columns:
              - column: { name: status }
