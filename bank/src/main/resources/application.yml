server:
  port: 8090

spring:
  application:
    name: mock-bank-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui

bank:
  master-key: "change-me-in-prod-minimum-32-chars!!"
  cors:
    allowed-origins:
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://localhost:5173
      - http://127.0.0.1:5173
  jwt:
    secret: bank-jwt-secret-change-me-minimum-32-chars!!
    expiration-minutes: 120
  webhook:
    max-retries: 3
    initial-delay-ms: 1000
  signing:
    timestamp-tolerance-seconds: 300
    nonce-cache-size: 10000
    nonce-cache-ttl-minutes: 10
