# Aktivira se profilom: local (pogledaj README — ./gradlew bootRun ga podrazumevano uključuje)
logging:
  file:
    name: logs/beauty-health-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/beauty_health
    username: beauty_health
    password: beauty_health
    driver-class-name: org.postgresql.Driver
  liquibase:
    # Runs changesets tagged with context "local" (e.g. moderator seed in 03-auth.yaml).
    contexts: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
