spring:
  application:
    name: beauty-health-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui

app:
  rate-limit:
    # In-memory per client IP (Bucket4j). Disable in tests via application-test.yml.
    enabled: true
    login-per-minute: 10
    review-posts-per-hour: 5
  orders:
    # Tekst rokova isporuke (snapshot se čuva na narudžbini). Kasnije B09/CMS ključ.
    delivery-summary-text: "Rok isporuke: 3–5 radnih dana (stub do definicije CMS/sekcije 7.3)."
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - http://localhost:5175
      - http://127.0.0.1:5175
  jwt:
    # Override in production (see application-prod.yml). Must be >= 32 UTF-8 bytes for HS256.
    secret: change-me-in-prod-minimum-thirty-two-chars!!
    expiration-minutes: 60
  password-reset:
    # Used to build the reset URL logged at INFO (until e-mail delivery is wired).
    storefront-base-url: http://localhost:5173
    token-validity-hours: 2
  bank:
    base-url: http://localhost:8090
    merchant-slug: beauty-health
    signing-mode: RSA
    private-key-pem: ""
    bank-public-key-pem: ""
  analytics:
    topic: bh.analytics.events.v1
    kafka:
      enabled: true
    outbox:
      poll-interval-ms: 5000
      batch-size: 50
    service:
      base-url: http://localhost:8081
      api-key: dev-analytics-api-key
