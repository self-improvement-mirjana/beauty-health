databaseChangeLog:
  - changeSet:
      id: b04-create-store-location
      author: beautyhealth
      changes:
        - createTable:
            tableName: store_location
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: slug, type: VARCHAR(128), constraints: { nullable: false, unique: true } }
              - column: { name: is_active, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: true }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: b04-create-brand
      author: beautyhealth
      changes:
        - createTable:
            tableName: brand
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: slug, type: VARCHAR(128), constraints: { nullable: false, unique: true } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: b04-create-category
      author: beautyhealth
      changes:
        - createTable:
            tableName: category
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: slug, type: VARCHAR(128), constraints: { nullable: false, unique: true } }
              - column: { name: description, type: VARCHAR(4000), constraints: { nullable: true } }
              - column: { name: parent_category_id, type: BIGINT, constraints: { nullable: true } }
              - column: { name: sort_order, type: INT, constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: is_active, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: true }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_category_parent
            baseTableName: category
            baseColumnNames: parent_category_id
            referencedTableName: category
            referencedColumnNames: id

  - changeSet:
      id: b04-create-product
      author: beautyhealth
      changes:
        - createTable:
            tableName: product
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: brand_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: slug, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: description, type: VARCHAR(4000), constraints: { nullable: true } }
              - column: { name: short_description, type: VARCHAR(500), constraints: { nullable: true } }
              - column: { name: is_featured, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: is_active, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: true }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_product_brand
            baseTableName: product
            baseColumnNames: brand_id
            referencedTableName: brand
            referencedColumnNames: id
        - createIndex:
            indexName: idx_product_brand_id
            tableName: product
            columns:
              - column: { name: brand_id }
        - createIndex:
            indexName: idx_product_featured
            tableName: product
            columns:
              - column: { name: is_featured }

  - changeSet:
      id: b04-create-product-category
      author: beautyhealth
      changes:
        - createTable:
            tableName: product_category
            columns:
              - column: { name: product_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: category_id, type: BIGINT, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: product_category
            columnNames: product_id, category_id
            constraintName: pk_product_category
        - addForeignKeyConstraint:
            constraintName: fk_pc_product
            baseTableName: product_category
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_pc_category
            baseTableName: product_category
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
        - createIndex:
            indexName: idx_pc_category
            tableName: product_category
            columns:
              - column: { name: category_id }

  - changeSet:
      id: b04-create-product-option
      author: beautyhealth
      changes:
        - createTable:
            tableName: product_option
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: product_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: sort_order, type: INT, constraints: { nullable: false }, defaultValueNumeric: 0 }
        - addForeignKeyConstraint:
            constraintName: fk_po_product
            baseTableName: product_option
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
        - createIndex:
            indexName: idx_po_product
            tableName: product_option
            columns:
              - column: { name: product_id }

  - changeSet:
      id: b04-create-product-option-value
      author: beautyhealth
      changes:
        - createTable:
            tableName: product_option_value
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: product_option_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: option_value, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: sort_order, type: INT, constraints: { nullable: false }, defaultValueNumeric: 0 }
        - addForeignKeyConstraint:
            constraintName: fk_pov_option
            baseTableName: product_option_value
            baseColumnNames: product_option_id
            referencedTableName: product_option
            referencedColumnNames: id

  - changeSet:
      id: b04-create-product-variant
      author: beautyhealth
      changes:
        - createTable:
            tableName: product_variant
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: product_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: sku, type: VARCHAR(128), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: true } }
              - column: { name: regular_price, type: "DECIMAL(12,2)", constraints: { nullable: false } }
              - column: { name: sale_price, type: "DECIMAL(12,2)", constraints: { nullable: true } }
              - column: { name: is_default, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_pv_product
            baseTableName: product_variant
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
        - createIndex:
            indexName: idx_pv_product
            tableName: product_variant
            columns:
              - column: { name: product_id }

  - changeSet:
      id: b04-create-product-variant-option
      author: beautyhealth
      changes:
        - createTable:
            tableName: product_variant_option
            columns:
              - column: { name: product_variant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: product_option_value_id, type: BIGINT, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: product_variant_option
            columnNames: product_variant_id, product_option_value_id
            constraintName: pk_pvo
        - addForeignKeyConstraint:
            constraintName: fk_pvo_variant
            baseTableName: product_variant_option
            baseColumnNames: product_variant_id
            referencedTableName: product_variant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_pvo_value
            baseTableName: product_variant_option
            baseColumnNames: product_option_value_id
            referencedTableName: product_option_value
            referencedColumnNames: id

  - changeSet:
      id: b04-create-inventory
      author: beautyhealth
      changes:
        - createTable:
            tableName: inventory
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: product_variant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: store_location_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: quantity, type: INT, constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_inv_variant
            baseTableName: inventory
            baseColumnNames: product_variant_id
            referencedTableName: product_variant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_inv_location
            baseTableName: inventory
            baseColumnNames: store_location_id
            referencedTableName: store_location
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: inventory
            columnNames: product_variant_id, store_location_id
            constraintName: uk_inventory_variant_location
