databaseChangeLog:
  - changeSet:
      id: b09-seed-content-sql
      author: beautyhealth
      changes:
        - sqlFile:
            path: db/changelog/sql/content-seed.sql
            relativeToChangelogFile: false
            encoding: UTF-8
            splitStatements: true
            stripComments: false

