databaseChangeLog:
  - changeSet:
      id: b07-create-orders
      author: beautyhealth
      changes:
        - createTable:
            tableName: orders
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: total_amount, type: "DECIMAL(12,2)", constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(3), constraints: { nullable: false } }
              - column: { name: recipient_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: recipient_phone, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: address_line1, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: address_line2, type: VARCHAR(255), constraints: { nullable: true } }
              - column: { name: city, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: postal_code, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: country_code, type: VARCHAR(2), constraints: { nullable: false } }
              - column: { name: delivery_summary_text, type: VARCHAR(2000), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_orders_user
            baseTableName: orders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
        - createIndex:
            indexName: idx_orders_user_id
            tableName: orders
            columns:
              - column: { name: user_id }
        - createIndex:
            indexName: idx_orders_created_at
            tableName: orders
            columns:
              - column: { name: created_at }

  - changeSet:
      id: b07-create-order-item
      author: beautyhealth
      changes:
        - createTable:
            tableName: order_item
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: order_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: product_variant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: quantity, type: INT, constraints: { nullable: false } }
              - column: { name: unit_price, type: "DECIMAL(12,2)", constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_order_item_order
            baseTableName: order_item
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_order_item_variant
            baseTableName: order_item
            baseColumnNames: product_variant_id
            referencedTableName: product_variant
            referencedColumnNames: id
        - createIndex:
            indexName: idx_order_item_order_id
            tableName: order_item
            columns:
              - column: { name: order_id }

  - changeSet:
      id: b07-create-payment-transaction
      author: beautyhealth
      changes:
        - createTable:
            tableName: payment_transaction
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: order_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: provider, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: amount, type: "DECIMAL(12,2)", constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(3), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_payment_order
            baseTableName: payment_transaction
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uk_payment_transaction_order
            tableName: payment_transaction
            columnNames: order_id

  - changeSet:
      id: b07-create-shipment
      author: beautyhealth
      changes:
        - createTable:
            tableName: shipment
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: order_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: carrier, type: VARCHAR(128), constraints: { nullable: true } }
              - column: { name: tracking_number, type: VARCHAR(128), constraints: { nullable: true } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_shipment_order
            baseTableName: shipment
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uk_shipment_order
            tableName: shipment
            columnNames: order_id
