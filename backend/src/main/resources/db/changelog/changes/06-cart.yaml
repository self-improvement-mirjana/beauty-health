databaseChangeLog:
  - changeSet:
      id: b06-create-cart
      author: beautyhealth
      changes:
        - createTable:
            tableName: cart
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: true } }
              - column: { name: guest_cart_token, type: VARCHAR(36), constraints: { nullable: true } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_cart_user
            baseTableName: cart
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
        - createIndex:
            indexName: idx_cart_user_id
            tableName: cart
            columns:
              - column: { name: user_id }

  - changeSet:
      id: b06-cart-guest-token-unique
      author: beautyhealth
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE UNIQUE INDEX uk_cart_guest_token ON cart (guest_cart_token) WHERE guest_cart_token IS NOT NULL;
        - sql:
            dbms: h2
            sql: CREATE UNIQUE INDEX uk_cart_guest_token ON cart (guest_cart_token);

  - changeSet:
      id: b06-cart-one-per-user
      author: beautyhealth
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE UNIQUE INDEX uk_cart_user_id ON cart (user_id) WHERE user_id IS NOT NULL;
        - sql:
            dbms: h2
            sql: CREATE UNIQUE INDEX uk_cart_user_id ON cart (user_id);

  - changeSet:
      id: b06-create-cart-item
      author: beautyhealth
      changes:
        - createTable:
            tableName: cart_item
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: cart_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: product_variant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: quantity, type: INT, constraints: { nullable: false } }
              - column: { name: unit_price_snapshot, type: "DECIMAL(12,2)", constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_cart_item_cart
            baseTableName: cart_item
            baseColumnNames: cart_id
            referencedTableName: cart
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_cart_item_variant
            baseTableName: cart_item
            baseColumnNames: product_variant_id
            referencedTableName: product_variant
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uk_cart_item_cart_variant
            tableName: cart_item
            columnNames: cart_id, product_variant_id
        - createIndex:
            indexName: idx_cart_item_cart_id
            tableName: cart_item
            columns:
              - column: { name: cart_id }
