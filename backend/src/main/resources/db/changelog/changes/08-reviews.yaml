databaseChangeLog:
  - changeSet:
      id: b08-create-review
      author: beautyhealth
      changes:
        - createTable:
            tableName: review
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: product_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: true } }
              - column: { name: rating, type: SMALLINT, constraints: { nullable: false } }
              - column: { name: body, type: VARCHAR(4000), constraints: { nullable: false } }
              - column: { name: author_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: author_email, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: is_public_email, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: is_approved, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: true }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_review_product
            baseTableName: review
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_review_user
            baseTableName: review
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
        - createIndex:
            indexName: idx_review_product_created
            tableName: review
            columns:
              - column: { name: product_id }
              - column: { name: created_at }
