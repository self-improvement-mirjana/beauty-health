spring:
  datasource:
    # Unique name per application context so multiple @SpringBootTest classes do not share one H2 catalog.
    url: jdbc:h2:mem:beautyhealth_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  rate-limit:
    enabled: false
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
  jwt:
    secret: test-jwt-secret-minimum-thirty-two-bytes!!
    expiration-minutes: 120
  analytics:
    kafka:
      enabled: false
